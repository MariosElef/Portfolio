[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mongodb = "3.9.1"
rand = "0.9"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
axum-test = "21.1.0"
http-body-util = "0.1.5"
tower = "0.5.3"
[lints.clippy]
float_arithmetic = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
