services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A single-node replica set: change streams, which tell the backend about edits, need one.
  # The healthcheck initiates the set on first start.
  mongo:
    # 8.3 refuses to start on Ubuntu's 7.0.14-based kernels (SERVER-136848); 8.2 runs there.
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      target: backend
    image: portfolio-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      BIND_ADDR: 0.0.0.0:8000
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://mongo:27017/portfolio?directConnection=true
      MEDIA_DIR: /data/media
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GITHUB_USER: ${GITHUB_USER:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      CHALLENGE_SECRET: ${CHALLENGE_SECRET:-}
    volumes: [media:/data/media]
    ports: ["127.0.0.1:8000:8000"]

  frontend:
    build:
      context: .
      target: frontend
    image: portfolio-frontend
    environment:
      API_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]

  caddy:
    image: caddy:alpine
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - media:/srv/media:ro
    depends_on: [frontend, backend]

  # The public way in on the server: an outbound tunnel to Cloudflare, so no inbound port opens.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    restart: unless-stopped

  caddy-dev:
    image: caddy:alpine
    profiles: ["dev"]
    ports: ["8443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./data/media:/srv/media:ro

volumes:
  pgdata:
  mongodata:
  media:
